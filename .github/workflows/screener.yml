name: Daily Stock Screener
on:
  workflow_dispatch: # Vẫn giữ dòng này để lúc nào thích bạn có thể tự bấm chạy tay
  schedule:
    # Hẹn giờ chạy lúc 15:30 chiều giờ Việt Nam, từ Thứ 2 đến Thứ 6
    # (Do máy chủ GitHub dùng múi giờ UTC, nên 15:30 VN = 08:30 UTC)
    - cron: '30 8 * * 1-5'

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Stock Screener
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
